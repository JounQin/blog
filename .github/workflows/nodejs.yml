name: Node CI

on:
  - push
  - pull_request

jobs:
  default:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # single source of truth for the Node version, shared with the
          # Cloudflare Workers build image (which also reads .node-version)
          node-version-file: .node-version
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install Dependencies
        run: yarn --immutable
        env:
          CI: true

      # Node version comes from .node-version (lts/*); Nuxt 4 needs >= 20.19 / 22.12
      - name: Lint
        run: yarn lint
        env:
          CI: true

      - name: Typecheck
        run: yarn typecheck
        env:
          CI: true

      - name: Build
        run: yarn build
        env:
          CI: true
