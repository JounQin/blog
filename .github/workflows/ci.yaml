name: CI

on:
  - push
  - pull_request

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          # single source of truth for the Node version, shared with the
          # Cloudflare Workers build image (which also reads .node-version)
          node-version-file: .node-version
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install Dependencies
        run: yarn --immutable
        env:
          CI: true

      # Node version comes from .node-version (lts/*); Nuxt 4 needs >= 20.19 / 22.12
      - name: Lint
        run: yarn lint
        env:
          CI: true

      - name: Typecheck
        run: yarn typecheck
        env:
          CI: true

      - name: Build
        run: yarn build
        env:
          CI: true
